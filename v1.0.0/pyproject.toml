[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mw-nv"
version = "1.0.0"
description = "MW-NV deterministic game engine bootstrap"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["PyYAML==6.0.3"]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[tool.setuptools]
packages = ["engine", "agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]

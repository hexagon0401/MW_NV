[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mw-nv"
version = "1.0.0"
description = "MW-NV deterministic game engine bootstrap"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["PyYAML==6.0.3"]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]
server = ["fastapi==0.128.0", "uvicorn==0.40.0", "httpx==0.28.1"]
learning = ["numpy==2.2.6", "pettingzoo==1.25.0", "gymnasium==1.2.3", "stable-baselines3==2.7.0", "sb3-contrib==2.7.0", "torch==2.8.0"]

[tool.setuptools]
packages = ["engine", "agents", "server", "learning"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
